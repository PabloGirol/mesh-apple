name: Build iOS 15 (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Meshtastic/**'
      - 'Shared/**'
      - 'project.yml'
      - 'scripts/**'
      - '.github/workflows/build-ios15.yml'

jobs:
  build:
    name: Build iOS 15 unsigned IPA
    runs-on: macos-15-intel  # Único runner funcional actualmente
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift 5.9 toolchain
        uses: fwal/setup-swift@v1
        with:
          swift-version: '5.9'

      - name: Verify Xcode / Swift version
        run: |
          xcodebuild -version
          swift --version
          # Verify we're on Swift 5.9
          if [[ $(swift --version | head -1) != *"5.9"* ]]; then
            echo "ERROR: Expected Swift 5.9, got $(swift --version)"
            exit 1
          fi

      - name: Clean SPM cache (avoid stale Package.resolved)
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          # Also remove any Package.resolved in the repo that might be v3 format
          find . -name "Package.resolved" -delete
          echo "Cleaned SPM cache and Package.resolved files"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Set xcdatamodeld current version to V58
        run: |
          echo "Before setting current version:"
          /usr/libexec/PlistBuddy -c "Print :_XCCurrentVersionName" Meshtastic/Meshtastic.xcdatamodeld/.xccurrentversion
          /usr/libexec/PlistBuddy -c "Set :_XCCurrentVersionName 'MeshtasticDataModelV 58.xcdatamodel'" Meshtastic/Meshtastic.xcdatamodeld/.xccurrentversion
          echo "After setting current version:"
          /usr/libexec/PlistBuddy -c "Print :_XCCurrentVersionName" Meshtastic/Meshtastic.xcdatamodeld/.xccurrentversion

      - name: Remove old Core Data model versions (keep only V58)
        run: |
          cd Meshtastic/Meshtastic.xcdatamodeld
          # Keep only V58, remove others completely (cleaner than mv)
          find . -maxdepth 1 -name 'MeshtasticDataModel*.xcdatamodel' -not -name 'MeshtasticDataModelV 58.xcdatamodel' -exec rm -rf {} +
          echo "Remaining model versions:"
          ls -la
          # Verify only V58 exists
          COUNT=$(find . -maxdepth 1 -name 'MeshtasticDataModel*.xcdatamodel' | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 model version, found $COUNT"
            exit 1
          fi

      - name: Generate Core Data entities
        run: |
          python3 scripts/generate_coredata_entities.py

      - name: Run bulk migration script
        run: |
          python3 scripts/bulk_migrate_ios15.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated project only references V58
        run: |
          # Check that the generated project only has V58 in Compile Sources
          if grep -r "MeshtasticDataModelV [0-9]\{1,2\}\.xcdatamodel" Meshtastic.xcodeproj/project.pbxproj | grep -v "MeshtasticDataModelV 58.xcdatamodel"; then
            echo "ERROR: Generated project references old model versions"
            grep -r "MeshtasticDataModelV" Meshtastic.xcodeproj/project.pbxproj
            exit 1
          fi
          echo "Project verification passed: Only V58 referenced"

      - name: Verify Compile Sources build phase has xcdatamodeld exactly once
        run: |
          # Extract the Meshtastic target's Compile Sources build phase and check xcdatamodeld references
          # Look for file references to Meshtastic.xcdatamodeld in the PBXSourcesBuildPhase
          PBXPROJ="Meshtastic.xcodeproj/project.pbxproj"

          # Count occurrences of Meshtastic.xcdatamodeld in the project file
          COUNT=$(grep -c "Meshtastic\.xcdatamodeld" "$PBXPROJ" || true)
          echo "Meshtastic.xcdatamodeld references in project.pbxproj: $COUNT"

          if [ "$COUNT" -gt 2 ]; then
            echo "WARNING: Meshtastic.xcdatamodeld appears $COUNT times in project.pbxproj (expected ~2: file ref + build phase)"
            grep -n "Meshtastic\.xcdatamodeld" "$PBXPROJ"
          fi

          # Check for duplicate entries in PBXSourcesBuildPhase for Meshtastic target
          # Look for the Meshtastic target's sources build phase
          echo "Checking for duplicate xcdatamodeld in Compile Sources..."

          # Verify the xcdatamodeld has a proper build rule (momc)
          if grep -q "compilerSpec.*=.*Xcode\.DataModelCompiler" "$PBXPROJ"; then
            echo "✓ Core Data model compiler build rule found"
          else
            echo "WARNING: No Core Data model compiler build rule found in project.pbxproj"
            echo "This may cause the model to be compiled by Swift compiler instead of momc"
          fi

          echo "Compile Sources verification complete"

      - name: Check generated project for build rule and currentVersion
        run: |
          export PBXPROJ="Meshtastic.xcodeproj/project.pbxproj"

          echo "=== XCVersionGroup currentVersion ==="
          grep -A2 "Meshtastic\.xcdatamodeld" "$PBXPROJ" | grep -A2 "currentVersion" || echo "Not found"

          echo "=== Meshtastic target buildRules ==="
          python3 << 'PYEOF'
          import re
          import os

          pbxproj_path = os.environ.get('PBXPROJ', 'Meshtastic.xcodeproj/project.pbxproj')

          with open(pbxproj_path, 'r') as f:
              content = f.read()

          # Find Meshtastic target
          target_match = re.search(r'([A-F0-9]{24}) /\* Meshtastic \*/ = \{[^}]*isa = PBXNativeTarget;', content)
          if target_match:
              target_id = target_match.group(1)
              print(f'Meshtastic target ID: {target_id}')

              target_section = content[target_match.start():]
              target_end = target_section.find('\n};')
              target_section = target_section[:target_end]

              # Find buildRules
              br_match = re.search(r'buildRules = \([^)]*\)', target_section, re.DOTALL)
              if br_match:
                  print(f'buildRules: {br_match.group(0)}')
              else:
                  print('buildRules: NOT FOUND (empty)')

              # Find buildPhases
              bp_match = re.search(r'buildPhases = \([^)]+\)', target_section, re.DOTALL)
              if bp_match:
                  print(f'buildPhases: {bp_match.group(0)}')

          # Check for DataModelCompiler build rule anywhere in project
          if 'Xcode.DataModelCompiler' in content:
              print('\n✓ Xcode.DataModelCompiler build rule FOUND in project')
              for line in content.split('\n'):
                  if 'Xcode.DataModelCompiler' in line:
                      print(f'  {line.strip()}')
          else:
              print('\n✗ Xcode.DataModelCompiler build rule NOT FOUND in project')
          PYEOF

      - name: Install xcodes CLI (binary)
        run: |
          curl -L https://github.com/XcodesOrg/xcodes/releases/download/2.1.0/xcodes.zip -o /tmp/xcodes.zip
          unzip -o /tmp/xcodes.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/xcodes

      - name: List available iOS simulator runtimes
        run: |
          xcodes runtimes list | head -30

      - name: Install iOS 15.5 simulator runtime
        run: |
          sudo xcodes runtimes install "iOS 15.5"

      - name: Build for iOS Simulator (verify compiles)
        run: |
          xcodebuild \
            -project Meshtastic.xcodeproj \
            -scheme Meshtastic \
            -destination 'platform=iOS Simulator,name=iPhone 13,OS=15.5' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build for Device (unsigned IPA)
        run: |
          xcodebuild \
            -project Meshtastic.xcodeproj \
            -scheme Meshtastic \
            -destination generic/platform=iOS \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -archivePath build/Meshtastic.xcarchive \
            archive

      - name: Export unsigned IPA (manual)
        run: |
          mkdir -p build/ipa
          # Copy .app from archive
          cp -R build/Meshtastic.xcarchive/Products/Applications/Meshtastic.app build/ipa/
          # Create IPA structure
          mkdir -p build/ipa/Payload
          mv build/ipa/Meshtastic.app build/ipa/Payload/
          cd build/ipa
          zip -r Meshtastic-unsigned.ipa Payload/
          echo "IPA created at: $(pwd)/Meshtastic-unsigned.ipa"
          ls -la Meshtastic-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meshtastic-iOS15-unsigned
          path: build/ipa/Meshtastic-unsigned.ipa
          retention-days: 30

      - name: Upload xcarchive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meshtastic-iOS15-xcarchive
          path: build/Meshtastic.xcarchive
          retention-days: 30