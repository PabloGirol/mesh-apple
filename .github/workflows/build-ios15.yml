name: Build iOS 15 (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Meshtastic/**'
      - 'Shared/**'
      - 'project.yml'
      - 'scripts/**'
      - '.github/workflows/build-ios15.yml'

jobs:
  build:
    name: Build iOS 15 unsigned IPA
    runs-on: macos-15-intel  # Único runner funcional actualmente
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift 5.9 toolchain
        uses: fwal/setup-swift@v1
        with:
          swift-version: '5.9'

      - name: Verify Xcode / Swift version
        run: |
          xcodebuild -version
          swift --version
          # Verify we're on Swift 5.9
          if [[ $(swift --version | head -1) != *"5.9"* ]]; then
            echo "ERROR: Expected Swift 5.9, got $(swift --version)"
            exit 1
          fi

      - name: Clean SPM cache (avoid stale Package.resolved)
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Set xcdatamodeld current version to V58
        run: |
          /usr/libexec/PlistBuddy -c "Set :_XCCurrentVersionName 'MeshtasticDataModelV 58.xcdatamodel'" Meshtastic/Meshtastic.xcdatamodeld/.xccurrentversion
          /usr/libexec/PlistBuddy -c "Print :_XCCurrentVersionName" Meshtastic/Meshtastic.xcdatamodeld/.xccurrentversion

      - name: Remove old Core Data model versions (keep only V58)
        run: |
          cd Meshtastic/Meshtastic.xcdatamodeld
          # Keep only V58, remove others completely (cleaner than mv)
          find . -maxdepth 1 -name 'MeshtasticDataModel*.xcdatamodel' -not -name 'MeshtasticDataModelV 58.xcdatamodel' -exec rm -rf {} +
          echo "Remaining model versions:"
          ls -la
          # Verify only V58 exists
          COUNT=$(find . -maxdepth 1 -name 'MeshtasticDataModel*.xcdatamodel' | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 model version, found $COUNT"
            exit 1
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated project only references V58
        run: |
          # Check that the generated project only has V58 in Compile Sources
          if grep -r "MeshtasticDataModelV [0-9]\{1,2\}\.xcdatamodel" Meshtastic.xcodeproj/project.pbxproj | grep -v "MeshtasticDataModelV 58.xcdatamodel"; then
            echo "ERROR: Generated project references old model versions"
            grep -r "MeshtasticDataModelV" Meshtastic.xcodeproj/project.pbxproj
            exit 1
          fi
          echo "Project verification passed: Only V58 referenced"
        run: xcodegen generate

      - name: Generate Core Data entities
        run: |
          python3 scripts/generate_coredata_entities.py

      - name: Run bulk migration script
        run: |
          python3 scripts/bulk_migrate_ios15.py

      - name: Install xcodes CLI (binary)
        run: |
          curl -L https://github.com/XcodesOrg/xcodes/releases/download/2.1.0/xcodes.zip -o /tmp/xcodes.zip
          unzip -o /tmp/xcodes.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/xcodes

      - name: Install iOS 15.5 simulator runtime
        run: |
          sudo xcodes runtimes install "iOS 15.5"

      - name: Build for iOS Simulator (verify compiles)
        run: |
          xcodebuild \
            -workspace Meshtastic.xcworkspace \
            -scheme Meshtastic \
            -destination 'platform=iOS Simulator,name=iPhone 13,OS=15.5' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build for Device (unsigned IPA)
        run: |
          xcodebuild \
            -workspace Meshtastic.xcworkspace \
            -scheme Meshtastic \
            -destination generic/platform=iOS \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -archivePath build/Meshtastic.xcarchive \
            archive

      - name: Export unsigned IPA (manual)
        run: |
          mkdir -p build/ipa
          # Copy .app from archive
          cp -R build/Meshtastic.xcarchive/Products/Applications/Meshtastic.app build/ipa/
          # Create IPA structure
          mkdir -p build/ipa/Payload
          mv build/ipa/Meshtastic.app build/ipa/Payload/
          cd build/ipa
          zip -r Meshtastic-unsigned.ipa Payload/
          echo "IPA created at: $(pwd)/Meshtastic-unsigned.ipa"
          ls -la Meshtastic-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meshtastic-iOS15-unsigned
          path: build/ipa/Meshtastic-unsigned.ipa
          retention-days: 30

      - name: Upload xcarchive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meshtastic-iOS15-xcarchive
          path: build/Meshtastic.xcarchive
          retention-days: 30